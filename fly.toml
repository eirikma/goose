# fly.toml app configuration file generated for goose-eirikma on 2026-11-08T20:10:23+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'goose-eirikma'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/goose.db'
  PORT = '8080'

[[mounts]]
  source = 'goose_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
